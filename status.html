<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Column - Live Status</title>

    <meta property="og:description" content="Check the real-time operational and security status of Column.">
    <meta property="og:image" content="https://raw.githubusercontent.com/columnndev/column/main/logo.png">
    <meta property="og:url" content="https://columnndev.github.io/column/status.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .status-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem 4rem;
            position: relative;
            z-index: 10;
        }
        
        .status-card {
            width: 100%;
            max-width: 600px;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        
        .status-header {
            text-align: center;
        }
        
        .status-header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        
        .status-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .status-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .pulse-indicator {
            width: 16px;
            height: 16px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .status-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        @media (max-width: 560px) {
            .stats-grid { grid-template-columns: 1fr; }
        }

        /* ── Update / downtime history ──────────────────────────────── */
        .history-block {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .history-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .history-head h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.02em;
        }

        .history-sub { font-size: 0.78rem; color: var(--text-muted); }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            max-height: 260px;
            overflow-y: auto;
        }

        .history-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.7rem 0.9rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 3px solid #6b7280;
            border-radius: 8px;
            font-size: 0.82rem;
        }

        .history-row.ongoing  { border-left-color: #f59e0b; }
        .history-row.resolved { border-left-color: #10b981; }
        .history-row.silent   { border-left-color: #6366f1; }

        .history-when { color: #fff; font-weight: 500; }
        .history-why  { color: var(--text-muted); font-size: 0.76rem; margin-top: 2px; }

        .history-dur {
            flex-shrink: 0;
            font-weight: 600;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .history-row.ongoing .history-dur { color: #f59e0b; }
        .history-row.silent  .history-dur { color: #818cf8; font-weight: 500; }

        .history-empty {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            padding: 1rem 0;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .stat-item:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.05);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            font-family: var(--font-display);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        
        .last-updated {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }
    </style>
</head>
<body>

        <canvas id="rain-canvas"></canvas>
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>
    
    <!-- Navbar -->
    <header class="navbar" data-aos="fade-down" data-aos-duration="800">
        <div class="nav-container">
            <div class="logo-wrapper" style="display: flex; align-items: center; gap: 0.8rem;">
                <img src="logo.png" alt="Column Logo" class="logo-img" style="height: 40px; width: auto; object-fit: contain; mix-blend-mode: screen;">
                <span class="logo">COLUMN</span>
            </div>
            <nav class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#features">Features</a>
                <a href="index.html#pricing">Pricing</a>
                <a href="index.html#faq">FAQ</a>
                <a href="news.html">News</a>
                <a href="status.html" style="color: white;">Status</a>
            </nav>
            <div class="nav-actions">
                <a href="login.html" class="btn-secondary desktop-only">Portal</a>
                <a href="index.html#pricing" class="btn-primary desktop-only">Purchase</a>
            </div>
        </div>
    </header>

    <main class="status-container">
        <div class="status-card glass-panel" data-aos="fade-up" data-aos-duration="1000">
            <div class="status-header">
                <h1>Live <span class="text-gradient">Status</span></h1>
                <p>Real-time network and security monitoring.</p>
            </div>
            
            <div class="status-box">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 0.5rem;">
                    <div class="pulse-indicator" id="status-pulse"></div>
                    <span class="status-title">Overwatch</span>
                </div>
                <div class="status-badge" id="status-badge">UNDETECTED</div>
            </div>

            <div class="stats-grid">
                <div class="stat-item" data-aos="fade-up" data-aos-delay="200">
                    <div class="stat-value" id="users-online">--</div>
                    <div class="stat-label">Users Online</div>
                </div>
                <div class="stat-item" data-aos="fade-up" data-aos-delay="300">
                    <div class="stat-value" id="uptime">--</div>
                    <div class="stat-label" id="uptime-label">Uptime</div>
                </div>
                <div class="stat-item" data-aos="fade-up" data-aos-delay="400">
                    <div class="stat-value" id="reported-bans">0</div>
                    <div class="stat-label">Reported Bans</div>
                </div>
            </div>

            <!-- Update / downtime history -->
            <div class="history-block" data-aos="fade-up" data-aos-delay="500">
                <div class="history-head">
                    <h2>Update History</h2>
                    <span class="history-sub" id="history-sub">Downtime while offsets are rebuilt</span>
                </div>
                <div id="history-list" class="history-list">
                    <div class="history-empty">Loading…</div>
                </div>
            </div>

            <div class="last-updated">
                Last checked: <span id="time-checked" style="color: white; font-weight: 500;">Just now</span>
            </div>
        </div>
    </main>

    <!-- Matrix Rain Canvas Script -->
    <script>
        // Matrix Rain
        const canvas = document.getElementById('rain-canvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            
            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const characters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*'.split('');
            const fontSize = 16;
            let columns = width / fontSize;
            let drops = [];
            for (let x = 0; x < columns; x++) { drops[x] = 1; }

            function drawRain() {
                ctx.fillStyle = 'rgba(5, 5, 8, 0.1)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#4f46e5';
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = characters[Math.floor(Math.random() * characters.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(drawRain, 35);
        }

        // Fetch live stats via worker (credentials stay server-side)
        document.addEventListener('DOMContentLoaded', () => {
            async function fetchStats() {
                try {
                    const d = await fetch('https://api.column.wtf/online').then(r => r.json());
                    const el = document.getElementById('users-online');
                    if (el && d.count !== null && d.count !== undefined) el.textContent = d.count;
                } catch(e) {
                    console.error("Failed to fetch online stats");
                }
                
                // Update checked time
                const now = new Date();
                const timeEl = document.getElementById('time-checked');
                if (timeEl) timeEl.textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }
            
            fetchStats();
            setInterval(fetchStats, 60000);

            // ── Uptime + update history ─────────────────────────────────────
            // Uptime is derived from the recorded outages rather than hardcoded.
            // A flat "100%" is never true — every Overwatch build change locks
            // the loader while offsets are rebuilt, and that is downtime.
            function fmtDuration(ms) {
                const mins = Math.max(1, Math.round(ms / 60000));
                if (mins < 60) return mins + 'm';
                const h = Math.floor(mins / 60), m = mins % 60;
                if (h < 24) return m ? `${h}h ${m}m` : `${h}h`;
                const d = Math.floor(h / 24), rh = h % 24;
                return rh ? `${d}d ${rh}h` : `${d}d`;
            }

            function fmtDate(d) {
                return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) +
                       ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            async function loadHistory() {
                let data;
                try {
                    const res = await fetch('status-history.json?t=' + Date.now());
                    if (!res.ok) throw new Error('http ' + res.status);
                    data = await res.json();
                } catch (e) {
                    document.getElementById('history-list').innerHTML =
                        '<div class="history-empty">History unavailable right now.</div>';
                    return;
                }

                const now       = Date.now();
                const windowDays = Number(data.uptimeWindowDays) || 30;
                const windowMs  = windowDays * 86400000;
                const windowStart = now - windowMs;
                const entries   = Array.isArray(data.downtime) ? data.downtime : [];

                // Sum only the portion of each outage that falls inside the window,
                // so an outage straddling the boundary is counted proportionally.
                let downMs = 0;
                entries.forEach(d => {
                    const s = Date.parse(d.start);
                    if (isNaN(s)) return;
                    const e = d.end ? Date.parse(d.end) : now;   // open entry = still down
                    const from = Math.max(s, windowStart);
                    const to   = Math.min(isNaN(e) ? now : e, now);
                    if (to > from) downMs += (to - from);
                });

                const pct = Math.max(0, Math.min(100, ((windowMs - downMs) / windowMs) * 100));
                // Floor rather than round, so 99.996% never displays as a flat 100%.
                const shown = (Math.floor(pct * 100) / 100).toFixed(2);
                document.getElementById('uptime').textContent = shown + '%';
                // Label is left alone so it stays translatable — the window is
                // spelled out in the history subtitle instead.

                const bansEl = document.getElementById('reported-bans');
                if (bansEl) bansEl.textContent = Number(data.reportedBans) || 0;

                // Newest first
                const sorted = entries.slice().sort((a, b) => Date.parse(b.start) - Date.parse(a.start));
                const list = document.getElementById('history-list');
                const sub  = document.getElementById('history-sub');

                if (!sorted.length) {
                    list.innerHTML = '<div class="history-empty">No downtime recorded yet.</div>';
                    if (sub) sub.textContent = 'No outages on record';
                    return;
                }

                const inWindow = sorted.filter(d => Date.parse(d.end || new Date().toISOString()) >= windowStart).length;
                if (sub) sub.textContent = `${inWindow} outage${inWindow === 1 ? '' : 's'} in the last ${windowDays} days`;

                list.innerHTML = sorted.slice(0, 12).map(d => {
                    const s = new Date(d.start);
                    const ongoing = !d.end;
                    const e = ongoing ? new Date() : new Date(d.end);
                    const ms = e - s;
                    // start == end means it shipped without taking the loader
                    // down. Say so rather than rounding it up to "1m".
                    const silent = !ongoing && ms <= 0;
                    const dur = silent ? 'No downtime' : fmtDuration(ms);
                    const why = d.reason || 'Maintenance';
                    const build = d.build ? ` · build ${d.build}` : '';
                    const cls = ongoing ? 'ongoing' : (silent ? 'silent' : 'resolved');
                    return `
                        <div class="history-row ${cls}">
                            <div>
                                <div class="history-when">${fmtDate(s)}${ongoing ? ' — ongoing' : ''}</div>
                                <div class="history-why">${why}${build}</div>
                            </div>
                            <div class="history-dur">${dur}</div>
                        </div>`;
                }).join('');
            }

            loadHistory();
            setInterval(loadHistory, 60000);

            // Apply global config
            if (typeof CONFIG !== 'undefined') {
                const badge = document.getElementById('status-badge');
                const pulse = document.getElementById('status-pulse');
                
                badge.textContent = CONFIG.cheatStatus;
                
                if (CONFIG.cheatStatus.toUpperCase() === "UPDATING") {
                    badge.style.color = "#f59e0b";
                    badge.style.background = "rgba(245, 158, 11, 0.1)";
                    badge.style.borderColor = "rgba(245, 158, 11, 0.2)";
                    
                    pulse.style.background = "#f59e0b";
                    pulse.style.boxShadow = "0 0 15px rgba(245, 158, 11, 0.6)";
                    pulse.style.animation = "pulse-yellow 2s infinite";
                    
                    // Add yellow pulse animation dynamically
                    const style = document.createElement('style');
                    style.innerHTML = `
                        @keyframes pulse-yellow {
                            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
                            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
                            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
                        }
                    `;
                    document.head.appendChild(style);
                } else if (CONFIG.cheatStatus.toUpperCase().includes("TESTING")) {
                    badge.style.color = "#3b82f6";
                    badge.style.background = "rgba(59, 130, 246, 0.1)";
                    badge.style.borderColor = "rgba(59, 130, 246, 0.2)";
                    
                    pulse.style.background = "#3b82f6";
                    pulse.style.boxShadow = "0 0 15px rgba(59, 130, 246, 0.6)";
                    pulse.style.animation = "pulse-blue 2s infinite";
                    
                    const style = document.createElement('style');
                    style.innerHTML = `
                        @keyframes pulse-blue {
                            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
                            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
                            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
                        }
                    `;
                    document.head.appendChild(style);
                }
            }
        });
    </script>
    
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true,
            offset: 50,
            duration: 800,
            easing: 'ease-out-cubic',
        });
    </script>
    <script src="i18n.js?v=1"></script>
</body>
